[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeguild"
version = "0.1.0"
description = "A local collaboration room for humans and independent coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vibeguild = "vibeguild.cli:main"

[tool.setuptools.packages.find]
include = ["vibeguild*"]

[tool.setuptools.package-data]
vibeguild = ["web/*", "skills/vibeguild/*", "skills/vibeguild/references/*", "skills/vibeguild/references/templates/*", "skills/vibeguild/scripts/*"]
